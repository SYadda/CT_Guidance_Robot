<text x="166" y="976" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">FEET ↓</text>
<text x="422" y="207" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Target position</text>
<text x="422" y="247" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Lie supine; raise both arms headward.</text>
<text x="422" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Place both hands beyond the head.</text>
<text x="422" y="309" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Use suitable arm supports.</text>
<text x="422" y="370" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Overhead camera checks</text>
<text x="422" y="410" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Elbows headward; arms clear of torso.</text>
<text x="422" y="441" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Both wrists headward of the shoulders.</text>
<text x="422" y="472" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">No lowered arms over chest or abdomen.</text>
<text x="422" y="533" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Allow natural variation</text>
<text x="422" y="573" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Bent elbows are allowed.</text>
<text x="422" y="604" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Hands need not touch or grip a fixture.</text>
<text x="422" y="635" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Allow comfortable minor asymmetry.</text>
<text x="422" y="696" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Technologist confirmation</text>
<text x="422" y="736" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Arm mobility and shoulder / arm injury.</text>
<text x="422" y="767" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Arm support, lines and gantry clearance.</text>
<text x="422" y="798" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Position before body scout per protocol.</text>
<text x="422" y="859" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Patient instruction</text>
<text x="422" y="899" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">If comfortable, raise both arms above</text>
<text x="422" y="930" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">your head. Rest them and keep still.</text>
<rect x="42" y="1050" width="18" height="18" rx="4" fill="#d7f1e7" stroke="#16846b" stroke-width="2"/>
<text x="71" y="1047" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">Green: illustrative target zones. Blue: landmarks and skeleton.</text>
<text x="42" y="1081" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">Supine top view, head at top. Not scan coverage or a pixel-matching template.</text>
<text x="42" y="1114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">Research design. Zone widths are not clinical thresholds; follow the exam protocol.</text>
</svg>