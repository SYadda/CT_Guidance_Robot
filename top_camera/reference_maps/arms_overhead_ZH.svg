<text x="166" y="976" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">床尾方向 ↓</text>
<text x="422" y="207" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">目标姿势</text>
<text x="422" y="247" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">仰卧，两臂同时向头端抬起。</text>
<text x="422" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">双手位于头顶以远的头端区域。</text>
<text x="422" y="309" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">使用合适的手臂支撑。</text>
<text x="422" y="370" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">顶置相机关注</text>
<text x="422" y="410" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">双肘向头端，手臂离开躯干。</text>
<text x="422" y="441" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">双腕位于各自肩部的头端侧。</text>
<text x="422" y="472" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">胸腹部不被放下的手臂覆盖。</text>
<text x="422" y="533" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">允许自然差异</text>
<text x="422" y="573" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">肘部可弯曲，不要求完全伸直。</text>
<text x="422" y="604" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">不要求双手相碰或抓住固定点。</text>
<text x="422" y="635" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">左右可有舒适的小幅差异。</text>
<text x="422" y="696" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">仍需技师确认</text>
<text x="422" y="736" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">患者能否举臂及有无肩臂损伤。</text>
<text x="422" y="767" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">手臂支撑、管路及机架间隙。</text>
<text x="422" y="798" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">按方案在躯干定位像前摆好。</text>
<text x="422" y="859" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">患者提示语</text>
<text x="422" y="899" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">请在能够舒适完成时，将双臂</text>
<text x="422" y="930" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#607583">举过头顶，放好后保持不动。</text>
<rect x="42" y="1050" width="18" height="18" rx="4" fill="#d7f1e7" stroke="#16846b" stroke-width="2"/>
<text x="71" y="1047" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">绿色：目标区域示意；蓝色：关键点与骨架</text>
<text x="42" y="1081" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">仰卧顶视图，头端向上；不是扫描范围或像素重合模板。</text>
<text x="42" y="1114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">研究设计图；区域宽度非临床阈值，具体摆位由检查方案确定。</text>
