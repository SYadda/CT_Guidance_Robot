<text x="166" y="976" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">FEET ↓</text>
<text x="422" y="207" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Target position</text>
<text x="422" y="247" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Lie supine with the head supported.</text>
<text x="422" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Rest both arms alongside the torso.</text>
<text x="422" y="309" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Hands beside the same-side hip or thigh.</text>
<text x="422" y="370" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Overhead camera checks</text>
<text x="422" y="410" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Align head, shoulders and pelvis to bed.</text>
<text x="422" y="441" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Keep each elbow and wrist on its side.</text>
<text x="422" y="472" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">No arms across torso or above the head.</text>
<text x="422" y="533" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Allow natural variation</text>
<text x="422" y="573" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Allow relaxed elbows and a small gap.</text>
<text x="422" y="604" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Rest legs naturally; supports are allowed.</text>
<text x="422" y="635" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Do not require a silhouette match.</text>
<text x="422" y="696" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Technologist confirmation</text>
<text x="422" y="736" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Head / neck angle and head support.</text>
<text x="422" y="767" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Vertical centering and lens avoidance.</text>
<text x="422" y="798" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Supports, comfort and exam protocol.</text>
<text x="422" y="859" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#193847">Patient instruction</text>
<text x="422" y="899" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">Lie on your back with both arms</text>
<text x="422" y="930" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#607583">at your sides. Keep your head still.</text>
<rect x="42" y="1050" width="18" height="18" rx="4" fill="#d7f1e7" stroke="#16846b" stroke-width="2"/>
<text x="71" y="1047" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">Green: illustrative target zones. Blue: landmarks and skeleton.</text>
<text x="42" y="1081" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">Supine top view, head at top. Not scan coverage or a pixel-matching template.</text>
<text x="42" y="1114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#607583">Research design. Zone widths are not clinical thresholds; follow the exam protocol.</text>
</svg>