<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient &amp; Room Readiness</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#1a3037;background:#f8fafb;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:72px 20px 32px}[hidden]{display:none!important}
header{position:absolute;top:20px;right:24px;display:flex;gap:16px;align-items:center;color:#77848a;font-size:12px}button{font:600 18px/1.3 Inter,"Segoe UI",sans-serif;border:0;border-radius:10px;padding:18px 42px;background:#173e47;color:white;cursor:pointer;min-width:180px}button:hover:enabled{background:#255663}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #77bbc4;outline-offset:4px}button.secondary{background:transparent;color:#38525d;border:1px solid #cad7dc;font-size:13px;min-width:0;padding:10px 14px}button.active{background:#fff0e5;color:#975015;border-color:#d69b63}header button{background:transparent;color:#38525d;font-size:13px;padding:0;min-width:0}
h1{font-size:clamp(32px,6vw,76px);line-height:1.08;text-align:center;margin:0;font-weight:800;letter-spacing:.02em}h1.ready{color:#178347}h1.blocked{color:#cf2936}p{margin:0;max-width:740px;text-align:center;font-size:13px;line-height:1.7;color:#6b7d84}#frame{position:relative;max-width:min(1040px,100%);line-height:0;user-select:none;touch-action:none}#photo{display:block;max-width:100%;max-height:60svh;border-radius:8px;width:auto;height:auto;box-shadow:0 6px 35px #14333d0d}#overlay{position:absolute;inset:0;pointer-events:none}.box{position:absolute;border:3px solid #ee2734;box-shadow:inset 0 0 0 1px #ffffff88}.ignored{border:2px dashed #cc8c21;background:#f5b34b33}.drawing{cursor:crosshair}#reviewActions,#maskActions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}#cameraNote{font-size:11px;white-space:nowrap}#error{color:#b82b38}a{font-size:12px;color:#4d6975}#video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
@media(max-width:600px){main{padding:66px 12px 24px;gap:14px}header{right:16px}button{padding:16px 28px}.box{border-width:2px}#cameraNote{font-size:10px}}
.pose{border-color:#187bff}.bed-map{position:absolute;inset:0;width:100%;height:100%}.bed-point{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f2c400;color:#283238;font:700 13px/1 sans-serif;border:2px solid white}#bedActions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#bedHint{color:#796100}.bed-confirm{display:flex;align-items:center;gap:8px;font-size:14px;color:#38525d}.bed-confirm input{width:18px;height:18px;accent-color:#b38e00}.red-key{color:#d32736}.blue-key{color:#187bff}
</style></head><body>
<header><span id="calibrationStatus">Not calibrated</span><button id="recalibrate" hidden>Calibrate</button></header>
<main>
  <h1 id="title" aria-live="polite" hidden></h1>
  <div id="frame" hidden><img id="photo" alt="Room photo" draggable="false"><div id="overlay"></div></div>
  <p id="hint">Clear the room, then capture an empty-room baseline.</p>
  <p id="legend" hidden><span class="red-key">Red: scene differences</span> · <span class="blue-key">Blue: patient position / visibility</span></p>
  <div id="bedActions" hidden><button class="secondary" id="markBed">Correct bed outline</button><button class="secondary" id="swapEnds">Swap head / foot</button><button class="secondary" id="clearBed">Clear bed corners</button><label class="bed-confirm"><input type="checkbox" id="bedConfirmed">Yellow outline and head end are correct</label></div>
  <p id="bedHint" hidden></p>
  <div id="maskActions" hidden><button class="secondary" id="ignore">Ignore area</button><button class="secondary" id="clearIgnored">Clear ignored areas</button></div>
  <p id="maskHint" hidden>Drag on the photo to ignore a small area, such as a moving cable. Other objects in that area will also be ignored.</p>
  <button id="mainAction" disabled>Calibrate</button>
  <div id="reviewActions" hidden><button id="confirm">Use as baseline</button><button class="secondary" id="retake">Retake</button><button class="secondary" id="cancel">Cancel</button></div>
  <p id="cameraNote" hidden></p>
  <a id="download" hidden>Download photo</a>
  <p id="progress" role="status" hidden></p><p id="error" role="alert" hidden></p>
</main>
<video id="video" autoplay playsinline muted aria-hidden="true"></video>
<script src="/camera.js"></script><script src="/app.js"></script>
</body></html>
